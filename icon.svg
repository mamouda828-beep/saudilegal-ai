<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Deep navy background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#05070e"/>
    </linearGradient>
    <!-- Gold gradient for the scales and shield -->
    <linearGradient id="gold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="30%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <!-- Subtle gold glow -->
    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <!-- Shield inner shadow -->
    <radialGradient id="shieldShadow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0a1628" stop-opacity="0"/>
      <stop offset="100%" stop-color="#05070e" stop-opacity="0.6"/>
    </radialGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Soft drop shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="4"/>
      <feOffset dx="0" dy="4" result="offsetBlur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Decorative outer ring -->
  <rect x="28" y="28" width="456" height="456" rx="88" fill="none" stroke="#1e3a5f" stroke-width="1.5" opacity="0.4"/>

  <!-- Shield shape -->
  <path
    d="M 256 70 L 386 120 L 386 270 Q 386 370 256 442 Q 126 370 126 270 L 126 120 Z"
    fill="#0d1f3c"
    stroke="url(#gold)"
    stroke-width="4"
    opacity="0.95"
  />
  <!-- Shield inner highlight -->
  <path
    d="M 256 82 L 374 127 L 374 268 Q 374 360 256 428 Q 138 360 138 268 L 138 127 Z"
    fill="none"
    stroke="#fbbf24"
    stroke-width="1"
    opacity="0.25"
  />
  <!-- Shield shadow overlay -->
  <path
    d="M 256 70 L 386 120 L 386 270 Q 386 370 256 442 Q 126 370 126 270 L 126 120 Z"
    fill="url(#shieldShadow)"
  />

  <!-- Scale of Justice (centered in shield) -->
  <g transform="translate(256, 250)" filter="url(#glow)">
    <!-- Center pole -->
    <rect x="-5" y="-95" width="10" height="175" rx="5" fill="url(#gold)"/>
    <!-- Top finial (decorative ball) -->
    <circle cx="0" cy="-100" r="11" fill="url(#goldLight)"/>
    <circle cx="0" cy="-100" r="6" fill="url(#gold)" opacity="0.7"/>
    <!-- Base plate -->
    <path d="M -38 78 L 38 78 L 30 90 L -30 90 Z" fill="url(#gold)" opacity="0.85"/>
    <rect x="-42" y="76" width="84" height="6" rx="3" fill="url(#goldLight)"/>
    <!-- Crossbar -->
    <rect x="-95" y="-72" width="190" height="7" rx="3.5" fill="url(#gold)"/>
    <!-- Crossbar end caps -->
    <circle cx="-95" cy="-69" r="5" fill="url(#goldLight)"/>
    <circle cx="95" cy="-69" r="5" fill="url(#goldLight)"/>

    <!-- Left scale arm chains -->
    <line x1="-75" y1="-69" x2="-75" y2="-22" stroke="#fbbf24" stroke-width="2.5" opacity="0.7"/>
    <line x1="-45" y1="-69" x2="-45" y2="-22" stroke="#fbbf24" stroke-width="2.5" opacity="0.7"/>
    <!-- Left scale pan (curved bowl) -->
    <path d="M -88 -22 Q -60 12 -32 -22 Z" fill="url(#gold)" opacity="0.9"/>
    <path d="M -88 -22 Q -60 12 -32 -22" fill="none" stroke="url(#goldLight)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Left pan top rim -->
    <line x1="-88" y1="-22" x2="-32" y2="-22" stroke="url(#goldLight)" stroke-width="3" stroke-linecap="round"/>

    <!-- Right scale arm chains -->
    <line x1="45" y1="-69" x2="45" y2="-22" stroke="#fbbf24" stroke-width="2.5" opacity="0.7"/>
    <line x1="75" y1="-69" x2="75" y2="-22" stroke="#fbbf24" stroke-width="2.5" opacity="0.7"/>
    <!-- Right scale pan (curved bowl) -->
    <path d="M 32 -22 Q 60 12 88 -22 Z" fill="url(#gold)" opacity="0.9"/>
    <path d="M 32 -22 Q 60 12 88 -22" fill="none" stroke="url(#goldLight)" stroke-width="2.5" stroke-linejoin="round"/>
    <!-- Right pan top rim -->
    <line x1="32" y1="-22" x2="88" y2="-22" stroke="url(#goldLight)" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Decorative laurel arcs at bottom of shield -->
  <g transform="translate(256, 400)" opacity="0.35">
    <path d="M -60 0 Q -40 -15 -20 -5" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
    <path d="M 60 0 Q 40 -15 20 -5" fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
